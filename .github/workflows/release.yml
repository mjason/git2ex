name: Build precompiled NIFs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux targets via rustler-precompiled-action (handles the aarch64 cross
  # build). It works on Linux runners; on macOS the action's bundled cross
  # install breaks (bsdtar lacks --wildcards), so macOS is built manually below.
  linux:
    name: NIF ${{ matrix.nif }} — ${{ matrix.job.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: x86_64-unknown-linux-gnu }
          - { target: aarch64-unknown-linux-gnu, use-cross: true }

    steps:
      - uses: actions/checkout@v4

      - name: Extract project version
        shell: bash
        run: echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs)" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build the crate
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: git2ex
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross || false }}
          project-dir: "native/git2ex"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.build-crate.outputs.file-name }}

  # macOS targets built natively (macos-13 = x86_64, macos-14 = arm64) and
  # packaged into the exact tarball layout RustlerPrecompiled downloads:
  # `libgit2ex-vX-nif-2.15-<target>.so.tar.gz` containing that same .so name.
  macos:
    name: NIF ${{ matrix.nif }} — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64-apple-darwin (macos-13) omitted — that runner queues for
        # hours and no consumer targets Intel Macs. See lib/git2ex.ex.
        include:
          - { target: aarch64-apple-darwin, os: macos-14, nif: "2.15" }

    steps:
      - uses: actions/checkout@v4

      - name: Extract project version
        run: echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs)" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and package
        env:
          RUSTLER_NIF_VERSION: ${{ matrix.nif }}
        run: |
          cargo build --release --manifest-path native/git2ex/Cargo.toml --target ${{ matrix.target }}
          name="libgit2ex-v${PROJECT_VERSION}-nif-${{ matrix.nif }}-${{ matrix.target }}.so"
          mkdir -p out
          # cargo emits a .dylib for cdylib on macOS; the BEAM loads it fine
          # under the .so name RustlerPrecompiled expects.
          cp "native/git2ex/target/${{ matrix.target }}/release/libgit2ex.dylib" "out/$name"
          tar -C out -czf "$name.tar.gz" "$name"
          echo "ARTIFACT=$name.tar.gz" >> $GITHUB_ENV

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ARTIFACT }}
