[package]
name = "git2ex"
version = "0.1.0"
edition = "2021"

[lib]
name = "git2ex"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
# Local repository operations only — no network transport, so drop the
# default https/ssh features (and their openssl dependency).
git2 = { version = "0.20", default-features = false }
